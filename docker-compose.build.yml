# Build the image from this repo instead of pulling it from GHCR:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# Different CLI version than the pinned one:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build --build-arg CLAUDE_VERSION=latest
services:
  claude:
    image: claude-container:local
    build:
      context: .
      args:
        EXTRA_APT_PACKAGES: ${EXTRA_APT_PACKAGES:-}
        WITH_UV: ${WITH_UV:-false}
