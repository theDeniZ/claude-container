name: Docker image

# Pull requests: build + smoke test only.
# Releases: build + push the image for a vX.Y.Z tag. Called by release.yml right
# after semantic-release creates the tag (tags pushed with GITHUB_TOKEN don't
# trigger workflows), or by pushing a v* tag by hand.
# A published version is never rebuilt or overwritten.

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: Release version without the leading "v" (e.g. 1.2.3)
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ -n "${version:-}" ]]; then
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release version: $version"; exit 1; }
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.version && format('v{0}', steps.version.outputs.version) || '' }}

      - name: Lint shell scripts
        run: shellcheck -x rootfs/usr/local/bin/*

      - name: Log in to GHCR
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        if: steps.version.outputs.publish == 'true'
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::$IMAGE:${{ steps.version.outputs.version }} already exists; published images are immutable."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: claude-container:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        id: smoke
        run: |
          set -euxo pipefail
          cli="$(docker run --rm --entrypoint /home/claude/.local/bin/claude claude-container:test --version | awk '{print $1}')"
          pinned="$(sed -n 's/^ARG CLAUDE_VERSION=//p' Dockerfile)"
          [[ "$cli" == "$pinned" ]]
          echo "claude_version=$cli" >> "$GITHUB_OUTPUT"

          mkdir -p ws && sudo chown 1234:1234 ws
          docker run -d --name smoke -e PUID=1234 -e PGID=1234 -v "$PWD/ws:/workspace" claude-container:test
          sleep 5
          docker logs smoke
          # UID/GID remapping
          [[ "$(docker exec -u claude smoke id -u)" == "1234" ]]
          [[ "$(docker exec -u claude smoke id -g)" == "1234" ]]
          # Wrapper drops root to the claude user
          docker exec smoke claude --version
          # Workspace trust was written to the persistent config dir
          docker exec -u claude smoke jq -e '.projects["/workspace"].hasTrustDialogAccepted' /home/claude/.claude/.claude.json
          # Health check: healthy with Remote Control off...
          docker exec smoke healthcheck
          docker rm -f smoke

          # ...and unhealthy with Remote Control on but no login.
          docker run -d --name smoke-rc -e CLAUDE_REMOTE_CONTROL=true claude-container:test
          sleep 5
          docker logs smoke-rc | grep -q "no claude.ai login"
          if docker exec smoke-rc healthcheck; then echo "expected unhealthy"; exit 1; fi
          docker rm -f smoke-rc

      - name: Image metadata
        if: steps.version.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            dev.claude-code.version=${{ steps.smoke.outputs.claude_version }}

      - name: Build and push (multi-arch)
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
